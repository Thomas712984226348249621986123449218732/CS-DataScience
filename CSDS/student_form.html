<!DOCTYPE html>
<html>
<head><title>Student Form</title><head>
<body>

<h1>Enrollment Student Form</h1>

<form action="/insert_student_simple" method="GET">

    <label>First Name: <input type ="test" name="first_name" maxlength="50"
required></label><br><br>
    <label>Last Name: <input type ="test" name="last_name" maxlength="50"
required></label><br><br>
    <label>Grade Level: <input type ="test" name="grade_level" 
required></label><br><br>
    <label>Email: <input type ="email" name="email" maxlength="100"></label><br><br>
    <label>Date of Enrollment: <input type ="date" name="enrollment_date"
required></label><br><br>

    <input type ="submit" value="Submit">

</form>

</body>
</html>
