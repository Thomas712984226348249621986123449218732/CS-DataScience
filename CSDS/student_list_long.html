<!--templates/students_list_long.html -->
<!DOCTYPE html>
<html>
<head><title>Students</title></head>
<body>
    <h2>Students</h2>
    <table> 
        <tr>
            <th>ID</th>
            <th>First</th>
            <th>Last</th>
            <th></th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td><a href="/update_student?student_id={{ student[0] }}">Update</a></td>
            <td><a href="/delete_student?student_id={{ student[0] }}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
